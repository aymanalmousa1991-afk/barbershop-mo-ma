app = "barbershop-mo-ma-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"
  PORT = "3001"
  REMINDER_CRON_SCHEDULE = "*/30 * * * *"

[mounts]
  source = "data"
  destination = "/app/data"
